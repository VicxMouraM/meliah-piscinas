<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>VicxMoura Gestão</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
  <style>
    /* Painel interno: barra lateral fixa + área de trabalho; mesmas cores do site */
    :root {
      --tile: #0A4F78;
      --water: #1FA4CC;
      --water-soft: #E3F3F8;
      --bg: #F3F7F9;
      --surface: #FFFFFF;
      --fg: #0F2733;
      --muted: #557080;
      --line: #D5E2E8;
      --on-tile: #F2FAFD;
      --buoy: #E0533A;
      --ok: #1F8A5B;
      --ok-soft: #E1F3EA;
      --warn: #B7791F;
      --warn-soft: #FBF0DC;
      --bad: #C2412D;
      --bad-soft: #FBE6E2;
      --f-display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
      --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
      --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
    }

    @media (prefers-color-scheme:dark) {
      :root {
        --tile: #0B3550;
        --water: #4CC3E6;
        --water-soft: #12303D;
        --bg: #0A161C;
        --surface: #10222B;
        --fg: #E4F1F5;
        --muted: #9DB4BE;
        --line: #22404D;
        --on-tile: #E8F7FC;
        --buoy: #FF7A5F;
        --ok: #4CC98F;
        --ok-soft: #123326;
        --warn: #E8B04B;
        --warn-soft: #33280F;
        --bad: #FF8A73;
        --bad-soft: #3A1A14;
        color-scheme: dark
      }
    }

    * {
      box-sizing: border-box
    }

    html,
    body {
      margin: 0;
      min-height: 100%
    }

    body {
      background: var(--bg);
      color: var(--fg);
      font: 15px/1.5 var(--f-body)
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
      color: inherit
    }

    :focus-visible {
      outline: 3px solid var(--water);
      outline-offset: 2px
    }

    [hidden] {
      display: none !important
    }

    .mono,
    .num {
      font-family: var(--f-mono);
      font-variant-numeric: tabular-nums
    }

    h1,
    h2,
    h3 {
      margin: 0;
      text-wrap: balance
    }

    a {
      color: var(--water)
    }

    body.ocupado {
      cursor: progress
    }

    body.ocupado .main .btn {
      opacity: .75
    }

    .sr {
      position: absolute;
      left: -9999px;
      width: 1px;
      height: 1px;
      overflow: hidden
    }

    #rede {
      position: fixed;
      left: 0;
      right: 0;
      top: 0;
      z-index: 60;
      background: var(--bad);
      color: #fff;
      text-align: center;
      font-weight: 700;
      padding: calc(6px + env(safe-area-inset-top, 0px)) 12px 6px
    }

    /* login */
    .center {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px max(16px, env(safe-area-inset-left))
    }

    .login {
      width: min(420px, 100%);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow: hidden
    }

    .login .band {
      background: var(--tile);
      color: var(--on-tile);
      padding: 22px 24px
    }

    .login .band b {
      font: 800 34px/1 var(--f-display);
      text-transform: uppercase;
      letter-spacing: .02em;
      display: block
    }

    .login .band span {
      font-size: 12px;
      letter-spacing: .14em;
      text-transform: uppercase;
      opacity: .8
    }

    .login form,
    .login .pad {
      padding: 22px 24px;
      display: grid;
      gap: 12px
    }

    .msg {
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 14px
    }

    .msg.err {
      background: var(--bad-soft);
      color: var(--bad)
    }

    .msg.info {
      background: var(--water-soft)
    }

    .msg.ok {
      background: var(--ok-soft);
      color: var(--ok)
    }

    /* shell */
    .app {
      display: grid;
      grid-template-columns: 220px 1fr;
      min-height: 100vh
    }

    .side {
      background: var(--tile);
      color: var(--on-tile);
      padding: 18px 12px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow: auto
    }

    .side .brand {
      font: 800 26px/1 var(--f-display);
      text-transform: uppercase;
      padding: 4px 10px 14px
    }

    .side .brand small {
      display: block;
      font: 600 11px var(--f-body);
      letter-spacing: .14em;
      opacity: .75;
      margin-top: 4px
    }

    .side button.nav {
      all: unset;
      cursor: pointer;
      padding: 8px 10px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 600;
      font-size: 15px
    }

    .side button.nav:hover {
      background: rgba(255, 255, 255, .08)
    }

    .side button.nav[aria-current="page"] {
      background: var(--on-tile);
      color: var(--tile)
    }

    .side .badge {
      background: var(--buoy);
      color: #fff;
      border-radius: 999px;
      font-size: 11px;
      padding: 1px 7px;
      min-width: 20px;
      text-align: center
    }

    .side .grp {
      font-size: 11px;
      letter-spacing: .14em;
      text-transform: uppercase;
      opacity: .6;
      padding: 12px 10px 4px
    }

    .side .me {
      margin-top: auto;
      padding: 12px 10px 0;
      border-top: 1px solid rgba(255, 255, 255, .15);
      font-size: 13px
    }

    .side .me button {
      all: unset;
      cursor: pointer;
      text-decoration: underline;
      opacity: .85;
      margin-top: 4px
    }

    .main {
      min-width: 0;
      padding-block: 22px 60px;
      padding-left: max(16px, env(safe-area-inset-left, 0px));
      padding-right: max(16px, env(safe-area-inset-right, 0px))
    }

    .main>div {
      max-width: 1200px;
      margin: 0 auto
    }

    .topbar {
      display: none
    }

    @media (max-width:860px) {
      .app {
        grid-template-columns: 1fr
      }

      .side {
        display: none
      }

      .topbar {
        display: flex;
        gap: 10px;
        align-items: center;
        background: var(--tile);
        color: var(--on-tile);
        padding: 10px max(16px, env(safe-area-inset-left, 0px));
        position: sticky;
        top: 0;
        z-index: 5
      }

      .topbar b {
        font: 800 22px var(--f-display);
        text-transform: uppercase
      }

      .topbar select {
        margin-left: auto;
        background: var(--on-tile);
        color: var(--tile);
        border: 0;
        border-radius: 8px;
        padding: 7px 10px;
        font-weight: 700;
        max-width: 60%
      }
    }

    /* conteúdo */
    .head {
      display: flex;
      gap: 12px;
      align-items: flex-end;
      justify-content: space-between;
      flex-wrap: wrap;
      margin-bottom: 18px
    }

    .head h1 {
      font: 800 34px/1 var(--f-display);
      text-transform: uppercase;
      letter-spacing: .02em
    }

    .head p {
      margin: 4px 0 0;
      color: var(--muted)
    }

    .row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center
    }

    .btn {
      border: 1px solid var(--line);
      background: var(--surface);
      border-radius: 8px;
      padding: 8px 14px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      color: var(--fg);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap
    }

    .btn.pri {
      background: var(--tile);
      border-color: var(--tile);
      color: var(--on-tile)
    }

    .btn.go {
      background: var(--ok);
      border-color: var(--ok);
      color: #fff
    }

    .btn.danger {
      color: var(--bad);
      border-color: var(--bad)
    }

    .btn.sm {
      padding: 4px 10px;
      font-size: 13px
    }

    .btn:disabled {
      opacity: .5;
      cursor: not-allowed
    }

    input,
    select,
    textarea {
      border: 1px solid var(--line);
      background: var(--surface);
      border-radius: 8px;
      padding: 8px 10px;
      width: 100%;
      min-width: 0
    }

    input[aria-invalid="true"],
    select[aria-invalid="true"] {
      border-color: var(--bad);
      background: var(--bad-soft)
    }

    textarea {
      min-height: 70px;
      resize: vertical
    }

    label.f {
      display: grid;
      gap: 4px;
      font-size: 13px;
      color: var(--muted);
      font-weight: 600;
      align-content: start
    }

    label.f small {
      font-weight: 500
    }

    .dica {
      font-size: 12px;
      color: var(--muted)
    }

    .dica[data-erro="1"] {
      color: var(--bad);
      font-weight: 600
    }

    .grid-form {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px
    }

    .grid-form .full {
      grid-column: 1/-1
    }

    .g3 {
      display: grid;
      grid-template-columns: 140px minmax(0, 1fr) 90px;
      gap: 12px
    }

    @media (max-width:560px) {
      .grid-form {
        grid-template-columns: 1fr
      }

      .g3 {
        grid-template-columns: 1fr 1fr
      }

      .g3>:nth-child(2) {
        grid-column: 1/-1;
        order: -1
      }
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 12px;
      margin-bottom: 18px
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px 16px;
      min-width: 0
    }

    .card .k {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .1em;
      color: var(--muted);
      font-weight: 700
    }

    .card .v {
      font: 500 24px var(--f-mono);
      font-variant-numeric: tabular-nums;
      margin-top: 4px
    }

    .card .s {
      font-size: 13px;
      color: var(--muted)
    }

    .card.warn {
      border-color: var(--warn)
    }

    .card.bad {
      border-color: var(--bad)
    }

    .card.good {
      border-color: var(--ok)
    }

    button.card {
      all: unset;
      cursor: pointer;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px 16px;
      min-width: 0
    }

    button.card:hover {
      border-color: var(--water)
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 16px;
      min-width: 0
    }

    .panel h2 {
      font: 800 20px var(--f-display);
      text-transform: uppercase;
      letter-spacing: .03em;
      margin-bottom: 10px
    }

    .two {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px
    }

    @media (max-width:900px) {
      .two {
        grid-template-columns: 1fr
      }
    }

    .tbl {
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--surface)
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px
    }

    th {
      text-align: left;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--muted);
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      white-space: nowrap;
      background: var(--bg)
    }

    td {
      padding: 9px 12px;
      border-bottom: 1px solid var(--line);
      vertical-align: middle
    }

    tr:last-child td {
      border-bottom: 0
    }

    td.r,
    th.r {
      text-align: right
    }

    td .act {
      display: flex;
      gap: 6px;
      justify-content: flex-end;
      flex-wrap: wrap
    }

    td small,
    .sub {
      color: var(--muted);
      font-size: 13px
    }

    .pill {
      display: inline-block;
      font-size: 12px;
      font-weight: 700;
      border-radius: 999px;
      padding: 2px 9px;
      white-space: nowrap
    }

    .pill.ok {
      background: var(--ok-soft);
      color: var(--ok)
    }

    .pill.warn {
      background: var(--warn-soft);
      color: var(--warn)
    }

    .pill.bad {
      background: var(--bad-soft);
      color: var(--bad)
    }

    .pill.info {
      background: var(--water-soft);
      color: var(--fg)
    }

    .pill.mut {
      background: var(--bg);
      color: var(--muted)
    }

    .empty {
      color: var(--muted);
      padding: 18px;
      text-align: center
    }

    .tabs {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 14px
    }

    .tabs button {
      border: 1px solid var(--line);
      background: var(--surface);
      border-radius: 999px;
      padding: 6px 14px;
      font-weight: 600;
      cursor: pointer
    }

    .tabs button[aria-pressed="true"] {
      background: var(--tile);
      color: var(--on-tile);
      border-color: var(--tile)
    }

    .tabs .badge {
      background: var(--buoy);
      color: #fff;
      border-radius: 999px;
      font-size: 11px;
      padding: 0 6px;
      margin-left: 4px
    }

    .list {
      display: grid;
      gap: 8px
    }

    .li {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding: 8px 0;
      border-bottom: 1px dashed var(--line);
      font-size: 14px
    }

    .li:last-child {
      border-bottom: 0
    }

    .banner {
      padding: 12px 14px;
      border-radius: 10px;
      margin-bottom: 14px;
      display: flex;
      gap: 10px;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap
    }

    .banner.warn {
      background: var(--warn-soft)
    }

    .banner.ok {
      background: var(--ok-soft)
    }

    .banner.info {
      background: var(--water-soft)
    }

    select.mini {
      width: auto;
      padding: 3px 6px;
      font-size: 13px
    }

    /* venda */
    .pdv {
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr);
      gap: 14px;
      align-items: start
    }

    @media (max-width:980px) {
      .pdv {
        grid-template-columns: 1fr
      }
    }

    .plist {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 8px;
      max-height: 62vh;
      overflow: auto;
      margin-top: 10px
    }

    .pbtn {
      all: unset;
      cursor: pointer;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px;
      background: var(--surface);
      display: grid;
      gap: 2px;
      font-size: 14px
    }

    .pbtn:hover {
      border-color: var(--water)
    }

    .pbtn b {
      font-weight: 600
    }

    .pbtn .st {
      font-size: 12px;
      color: var(--muted)
    }

    .pbtn .st.low {
      color: var(--bad);
      font-weight: 700
    }

    .cart-line {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 72px 96px 32px;
      gap: 6px;
      align-items: center;
      padding: 6px 0;
      border-bottom: 1px dashed var(--line)
    }

    .cart-line input {
      padding: 5px 6px
    }

    .cart-line .x {
      border: 0;
      background: none;
      color: var(--bad);
      font-size: 18px;
      cursor: pointer
    }

    .tot {
      display: grid;
      gap: 4px;
      margin-top: 10px
    }

    .tot .row {
      justify-content: space-between
    }

    .tot .big {
      font: 800 30px var(--f-display)
    }

    fieldset {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px;
      margin: 0;
      min-width: 0
    }

    legend {
      font-size: 13px;
      font-weight: 700;
      color: var(--muted);
      padding: 0 6px
    }

    /* modal e aviso */
    dialog {
      border: 0;
      border-radius: 14px;
      padding: 0;
      width: min(680px, calc(100% - 24px));
      background: var(--surface);
      color: var(--fg);
      box-shadow: 0 20px 60px rgba(0, 0, 0, .35)
    }

    dialog::backdrop {
      background: rgba(5, 20, 28, .55)
    }

    dialog .mh {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 18px;
      border-bottom: 1px solid var(--line)
    }

    dialog .mh h3 {
      font: 800 22px var(--f-display);
      text-transform: uppercase
    }

    dialog .mb {
      padding: 16px 18px;
      max-height: 70vh;
      overflow: auto
    }

    dialog .mf {
      padding: 12px 18px;
      border-top: 1px solid var(--line);
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      flex-wrap: wrap
    }

    .xbtn {
      border: 0;
      background: none;
      font-size: 24px;
      cursor: pointer;
      color: var(--fg)
    }

    #merr {
      margin-bottom: 12px
    }

    #toast {
      position: fixed;
      left: 50%;
      bottom: calc(20px + env(safe-area-inset-bottom, 0px));
      transform: translateX(-50%);
      background: var(--fg);
      color: var(--bg);
      padding: 10px 16px;
      border-radius: 10px;
      font-weight: 600;
      z-index: 70;
      max-width: calc(100% - 32px)
    }

    #toast.err {
      background: var(--bad);
      color: #fff
    }

    .items-ed .it {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 70px 100px 32px;
      gap: 6px;
      margin-bottom: 6px
    }

    @media (max-width:560px) {
      .items-ed .it {
        grid-template-columns: minmax(0, 1fr) 60px 84px 28px
      }
    }

    .steps {
      display: flex;
      gap: 4px;
      flex-wrap: wrap
    }
  </style>
  <script src="../vendor/supabase.js"></script>
  <script src="../config.js"></script>
  <script src="../comum.js"></script>
</head>

<body>

  <div id="rede" hidden>Sem conexão com a internet. O que você fizer agora não será salvo até a conexão voltar.</div>
  <div id="screen"></div>
  <dialog id="modal">
    <form method="dialog" id="mform" novalidate><button value="ok" class="sr" tabindex="-1"
        aria-hidden="true">ok</button>
      <div class="mh">
        <h3 id="mtitle"></h3><button class="xbtn" value="cancel" aria-label="Fechar" formnovalidate>×</button>
      </div>
      <div class="mb">
        <div id="merr" class="msg err" hidden></div>
        <div id="mbody"></div>
      </div>
      <div class="mf" id="mfoot"></div>
    </form>
  </dialog>
  <div id="toast" role="status" aria-live="polite" hidden></div>

  <script>
    "use strict";
    /* ================== base ================== */
    const CFG = window.LOJA_CONFIG || window.MELIAH_CONFIG || {};
    const $ = (s, el = document) => el.querySelector(s);
    const $$ = (s, el = document) => [...el.querySelectorAll(s)];
    const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const brl = v => Number(v || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
    const qtd = v => Number(v || 0).toLocaleString("pt-BR", { maximumFractionDigits: 3 });
    const hoje = () => new Date().toLocaleDateString("sv-SE");
    const addDias = (d, n) => { const x = new Date(d + "T12:00:00"); x.setDate(x.getDate() + n); return x.toLocaleDateString("sv-SE"); };
    const inicioDoDia = d => new Date((d || hoje()) + "T00:00:00").toISOString();
    const dataBR = d => d ? new Date(String(d).length <= 10 ? d + "T12:00:00" : d).toLocaleDateString("pt-BR") : "—";
    const horaBR = d => d ? new Date(d).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" }) : "";
    const mesAtual = () => hoje().slice(0, 7);
    const D = v => MC.digitos(v);
    const fTel = v => MC.formatar.tel(v), fCep = v => MC.formatar.cep(v), fDoc = v => MC.formatar.doc(v);
    const num = v => v === "" || v == null ? null : Number(String(v).replace(",", "."));
    const waLink = (tel, txt) => { let d = D(tel); if (!d) return ""; if (d.length <= 11) d = "55" + d; return "https://wa.me/" + d + "?text=" + encodeURIComponent(txt || ""); };
    const mapsLink = end => "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(end);
    const FORMAS = { pix: "Pix", credito: "Cartão de crédito", debito: "Cartão de débito", boleto: "Boleto", transferencia: "Transferência", dinheiro: "Dinheiro na entrega" };
    const FORMAS_OPT = Object.entries(FORMAS);

    function toast(msg, err) { const t = $("#toast"); t.textContent = msg; t.className = err ? "err" : ""; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, err ? 7000 : 2800); }
    function traduz(m) {
      m = String(m || "");
      if (/Invalid login/i.test(m)) return "E-mail ou senha incorretos.";
      if (/Email not confirmed/i.test(m)) return "Este e-mail ainda não foi confirmado. Peça ao administrador para marcar o usuário como confirmado no Supabase.";
      if (/JWT expired|invalid JWT|jwt/i.test(m)) return "SESSAO";
      if (/clientes_doc_valido/.test(m)) return "CPF ou CNPJ inválido. Confira os números.";
      if (/clientes_tel_valido/.test(m)) return "Telefone inválido. Use DDD + número.";
      if (/clientes_cep_valido/.test(m)) return "CEP inválido. Use os 8 números.";
      if (/permission denied|row-level security/i.test(m)) return "Você não tem permissão para isso.";
      if (/duplicate key.*produtos_pkey/i.test(m)) return "Já existe um produto com esse código.";
      if (/violates foreign key/i.test(m)) return "Este registro está ligado a outros (vendas, contratos ou orçamentos) e não pode ser apagado.";
      if (/Failed to fetch|NetworkError|Load failed|network/i.test(m)) return "Sem conexão com o servidor. Verifique a internet e tente de novo.";
      if (/value too long/i.test(m)) return "Algum campo passou do tamanho máximo.";
      if (/invalid input syntax/i.test(m)) return "Algum valor foi digitado em formato inválido.";
      return m;

    function fld(name, label, { type = "text", value = "", req = false, full = false, opts = null, step, min, max, ph = "", attrs = "", mask = "", dica = "" } = {}) {
      let input;
      const common = `name="${name}" id="f_${name}" ${req ? "required" : ""} ${attrs}`;
      if (opts) input = `<select ${common}>${opts.map(o => { const [v, l] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(v)}" ${String(v) === String(value ?? "") ? "selected" : ""}>${esc(l)}</option>` }).join("")}</select>`;
      else if (type === "textarea") input = `<textarea ${common} placeholder="${esc(ph)}">${esc(value)}</textarea>`;
      else if (type === "checkbox") return `<label class="f ${full ? "full" : ""}" style="display:flex;gap:8px;align-items:center;color:var(--fg)"><input type="checkbox" name="${name}" id="f_${name}" style="width:auto" ${value ? "checked" : ""} ${attrs}> ${esc(label)}</label>`;
      else {
        const im = mask === "tel" ? 'inputmode="tel" autocomplete="tel"' : mask ? 'inputmode="numeric"' : "";

      }
      return `<label class="f ${full ? "full" : ""}">${esc(label)}${req ? " *" : ""}${input}${dica ? `<span class="dica" id="d_${name}">${dica}</span>` : ""}</label>`;

    /* ================== inicialização e login ================== */

      $("#view").innerHTML = head("Nova venda", "Para vendas fechadas por WhatsApp, telefone ou Instagram. Pedidos do site entram pela tela Site.") +
        `<div class="pdv">
    <div class="panel"><div class="row"><input id="busca" type="search" placeholder="Buscar produto por nome ou código" style="flex:1" aria-label="Buscar produto"><button class="btn" data-a="avulso">+ Serviço / item avulso</button></div>

    <form class="panel" id="fvenda" novalidate><h2>Venda</h2><div id="cart"></div>
      <div class="grid-form" style="margin-top:12px">

        ${fld("desconto", "Desconto (R$)", { type: "number", step: "0.01", min: 0, value: "0" })}

      ligarEndereco("e_");
      const desenharLista = () => {

        $("#f_nomeav").value = "";

      $("#fvenda").addEventListener("submit", e => { e.preventDefault(); run(finalizarVenda); });
      delegar($("#view"), {
        add: id => {
          const p = cache.produtos.find(x => x.id === id); const ex = carrinho.find(c => c.produto_id === id);

          const r = await modal({

    async function finalizarVenda() {

        }), "Nenhuma venda neste filtro.");
      $("#fper").onchange = e => { fVendas.periodo = e.target.value; recarregar(); };

      q(sb.from("lancamentos").select("*, clientes(nome,telefone)").not("contrato_id", "is", null).eq("competencia", comp).neq("status", "cancelado").order("vencimento")), carregarConfig()]);
      const ativos = ct.filter(c => c.ativo);
      const recebido = cob.filter(x => x.status === "pago").reduce((s, x) => s + Number(x.valor), 0), aberto = cob.filter(x => x.status === "aberto").reduce((s, x) => s + Number(x.valor), 0);
      $("#view").innerHTML = head("Mensalidades", "Contratos de manutenção e as cobranças de cada mês.", `<button class="btn pri" data-a="novo">+ Novo contrato</button>`) +
        `<div class="cards"><div class="card"><div class="k">Contratos ativos</div><div class="v">${ativos.length}</div><div class="s">${brl(ativos.reduce((s, c) => s + Number(c.valor_mensal), 0))} por mês</div></div>
   <div class="card good"><div class="k">Recebido no mês</div><div class="v">${brl(recebido)}</div></div><div class="card ${aberto ? "warn" : ""}"><div class="k">Em aberto no mês</div><div class="v">${brl(aberto)}</div></div></div>
  <div class="panel" style="margin-bottom:14px"><div class="row" style="justify-content:space-between;margin-bottom:10px"><h2 style="margin:0">Cobranças de</h2>
    <div class="row"><input type="month" id="mes" value="${mesMens}" style="width:auto" aria-label="Mês"><button class="btn go" data-a="gerar">Gerar cobranças do mês</button></div></div>
    ${tabela([{ t: "Cliente" }, { t: "Vencimento" }, { t: "Valor", r: 1 }, { t: "Situação" }, { t: "", r: 1 }], cob.map(x => {
          const venc = x.status === "aberto" && x.vencimento < hoje();
          return `<tr><td>${esc(x.clientes?.nome)}</td><td>${dataBR(x.vencimento)}</td><td class="r num">${brl(x.valor)}</td><td>${x.status === "pago" ? '<span class="pill ok">Pago</span>' : venc ? '<span class="pill bad">Vencido</span>' : '<span class="pill warn">Em aberto</span>'}</td>
      <td><div class="act">${x.status === "aberto" ? `${x.clientes?.telefone ? `<a class="btn sm" target="_blank" rel="noopener" href="${esc(waLink(x.clientes.telefone, `Olá, ${x.clientes.nome}! Lembrete da VicxMoura Piscinas: a mensalidade de manutenção (${mesMens.slice(5)}/${mesMens.slice(0, 4)}) de ${brl(x.valor)} vence em ${dataBR(x.vencimento)}.` + linhaPix() + ` Obrigado!`))}">Cobrar</a>` : ""}<button class="btn sm go" data-a="baixar" data-id="${x.id}">Recebido</button>` : ""}</div></td></tr>`;
        }),
          "Nenhuma cobrança neste mês. Clique em \"Gerar cobranças do mês\".")}</div>
  <div class="panel"><h2>Contratos</h2>${tabela([{ t: "Cliente" }, { t: "Serviço" }, { t: "Visitas" }, { t: "Valor", r: 1 }, { t: "Vence dia", r: 1 }, { t: "Situação" }, { t: "", r: 1 }],
            ct.map(c => `<tr><td>${esc(c.clientes?.nome)}</td><td>${esc(c.descricao)}</td><td>${esc(c.visitas)}${c.dia_visita ? " · " + esc(c.dia_visita) : ""}</td><td class="r num">${brl(c.valor_mensal)}</td><td class="r num">${c.dia_vencimento}</td><td>${c.ativo ? '<span class="pill ok">Ativo</span>' : '<span class="pill mut">Encerrado</span>'}</td><td><div class="act"><button class="btn sm" data-a="edit" data-id="${c.id}">Editar</button></div></td></tr>`), "Nenhum contrato.")}</div>`;
      $("#mes").onchange = e => { mesMens = e.target.value || mesAtual(); recarregar(); };
      delegar($("#view"), {
        gerar: async () => { const n = await q(sb.rpc("gerar_mensalidades", { p_mes: comp })); toast(n ? n + " cobrança(s) criada(s)." : "Todas as cobranças deste mês já existiam (ou não há contratos ativos)."); recarregar(); },
        baixar: id => acaoBaixar(id),
        novo: () => formContrato(), edit: id => formContrato(ct.find(c => c.id == id))
      });
    };
    async function formContrato(c) {
      const novo = !c; c = c || { descricao: "Manutenção mensal", visitas: "1x por semana", dia_vencimento: 10, inicio: hoje(), ativo: true };
      if (!cache.clientes.length) throw new Error("Cadastre o cliente primeiro (tela Clientes).");
      const r = await modal({
        title: novo ? "Novo contrato" : "Editar contrato", body: `<div class="grid-form">
    ${fld("cliente_id", "Cliente", { opts: [["", "— escolha —"], ...cache.clientes.map(x => [x.id, x.nome])], value: c.cliente_id || "", req: true, full: true })}
    ${fld("descricao", "Serviço", { value: c.descricao, req: true, full: true })}
    ${fld("valor_mensal", "Valor mensal (R$)", { type: "number", step: "0.01", min: 0.01, value: c.valor_mensal ?? "", req: true })}
    ${fld("dia_vencimento", "Dia do vencimento (1 a 28)", { type: "number", min: 1, max: 28, value: c.dia_vencimento, req: true })}
    ${fld("visitas", "Frequência das visitas", { value: c.visitas, opts: ["1x por semana", "2x por semana", "A cada 15 dias", "1x por mês"] })}
    ${fld("dia_visita", "Dia da visita", { value: c.dia_visita || "", ph: "Ex.: terça de manhã" })}
    ${fld("inicio", "Início", { type: "date", value: c.inicio, req: true })}
    ${fld("ativo", "Contrato ativo", { type: "checkbox", value: c.ativo })}
    ${fld("observacoes", "Observações", { type: "textarea", value: c.observacoes || "", full: true })}</div>`,
        validate: d => !(num(d.valor_mensal) > 0) ? ["Valor mensal deve ser maior que zero.", "valor_mensal"] : !(parseInt(d.dia_vencimento) >= 1 && parseInt(d.dia_vencimento) <= 28) ? ["O dia do vencimento deve ser de 1 a 28.", "dia_vencimento"] : null
      });
      if (!r) return;
      const d = { ...r, cliente_id: Number(r.cliente_id), valor_mensal: num(r.valor_mensal), dia_vencimento: parseInt(r.dia_vencimento) };
      if (novo) await q(sb.from("contratos").insert(d)); else await q(sb.from("contratos").update(d).eq("id", c.id));
      toast("Contrato salvo."); recarregar();
    }

    /* ================== ORÇAMENTOS ================== */
    const ST_ORC = { rascunho: ["Rascunho", "mut"], enviado: ["Enviado", "info"], aprovado: ["Aprovado", "ok"], recusado: ["Recusado", "bad"], convertido: ["Virou venda", "ok"] };
    TELAS.orcamentos = async () => {
      const [orc] = await Promise.all([q(sb.from("orcamentos").select("*, orcamento_itens(*)").order("id", { ascending: false }).limit(200)), carregarClientes(), carregarProdutos(), carregarConfig()]);
      const abertos = orc.filter(o => ["rascunho", "enviado", "aprovado"].includes(o.status));
      $("#view").innerHTML = head("Orçamentos", "Monte, envie pelo WhatsApp e transforme em venda quando o cliente aprovar.", `<button class="btn pri" data-a="novo">+ Novo orçamento</button>`) +
        `<div class="cards"><div class="card"><div class="k">Em negociação</div><div class="v">${brl(abertos.reduce((s, o) => s + Number(o.total), 0))}</div><div class="s">${abertos.length} orçamento(s)</div></div></div>` +
        tabela([{ t: "#" }, { t: "Data" }, { t: "Cliente" }, { t: "Título" }, { t: "Total", r: 1 }, { t: "Validade" }, { t: "Situação" }, { t: "", r: 1 }], orc.map(o => {
          const [l, c] = ST_ORC[o.status]; const vencido = ["rascunho", "enviado"].includes(o.status) && o.validade < hoje();
          return `<tr><td class="mono">${o.id}</td><td>${dataBR(o.criado_em)}</td><td>${esc(o.cliente_nome)}${o.telefone ? `<br><small class="mono">${fTel(o.telefone)}</small>` : ""}</td><td>${esc(o.titulo)}</td><td class="r num">${brl(o.total)}</td><td>${dataBR(o.validade)}${vencido ? ' <span class="pill bad">vencido</span>' : ""}</td><td><span class="pill ${c}">${l}</span></td>
    <td><div class="act">${o.telefone ? `<a class="btn sm" target="_blank" rel="noopener" href="${esc(waLink(o.telefone, textoOrcamento(o)))}" data-a="enviado" data-id="${o.id}">Enviar</a>` : ""}
    ${o.status !== "convertido" ? `<button class="btn sm" data-a="edit" data-id="${o.id}">Editar</button><button class="btn sm go" data-a="conv" data-id="${o.id}">Virar venda</button>` : `<span class="pill ok">Venda #${o.venda_id}</span>`}</div></td></tr>`;
        }), "Nenhum orçamento.");
      delegar($("#view"), {
        novo: async () => { if (await formOrcamento()) recarregar(); },
        edit: async id => { if (await formOrcamento(orc.find(o => o.id == id))) recarregar(); },
        enviado: async id => { const o = orc.find(x => x.id == id); if (o.status === "rascunho") { await q(sb.from("orcamentos").update({ status: "enviado" }).eq("id", id)); setTimeout(recarregar, 600); } },
        conv: async id => {
          const o = orc.find(x => x.id == id);
          if (!o.orcamento_itens.length) throw new Error("O orçamento não tem itens.");
          const p = modal({
            title: "Orçamento #" + id + " → venda", ok: "Registrar venda", okClass: "go", body: `<p>Total ${brl(o.total)}. Os produtos do estoque serão baixados.</p><div class="grid-form">${fld("forma", "Forma de pagamento", { opts: FORMAS_OPT, value: "pix" })}${fld("pago", "Pagamento já recebido", { type: "checkbox", value: false })}<div id="bv">${fld("venc", "Vencimento", { type: "date", value: addDias(hoje(), 7) })}</div></div>`,
            validate: d => !d.pago && !d.venc ? ["Informe o vencimento.", "venc"] : null
          });
          $("#f_pago").onchange = e => $("#bv").hidden = e.target.checked;
          const r = await p; if (!r) return;
          const v = await q(sb.rpc("converter_orcamento", { p_id: Number(id), p_forma: r.forma, p_pago: !!r.pago, p_vencimento: r.pago ? null : r.venc })); toast("Venda #" + v + " registrada."); recarregar();
        }
      });
    };
    function textoOrcamento(o) {
      return `*VicxMoura Piscinas – Orçamento #${o.id}*\n${o.titulo}\n\n` + o.orcamento_itens.map(i => `• ${qtd(i.quantidade)}× ${i.descricao} — ${brl(i.total)}`).join("\n") +
        (Number(o.desconto) ? `\nDesconto: − ${brl(o.desconto)}` : "") + `\n*Total: ${brl(o.total)}*\nVálido até ${dataBR(o.validade)}` + (o.condicoes ? `\n\n${o.condicoes}` : "");
    }
    async function formOrcamento(o, pre = {}) {
      const novo = !o; o = o || { status: "rascunho", validade: addDias(hoje(), 15), desconto: 0, orcamento_itens: [], condicoes: "Pagamento: 50% na aprovação e 50% na entrega. Prazo de instalação a combinar.", ...pre };
      const itens = (o.orcamento_itens || []).map(i => ({ produto_id: i.produto_id || "", descricao: i.descricao, quantidade: Number(i.quantidade), preco_unit: Number(i.preco_unit) }));
      if (!itens.length) itens.push({ produto_id: "", descricao: "", quantidade: 1, preco_unit: 0 });
      const prodOpts = `<option value="">Item livre / serviço</option>` + cache.produtos.filter(p => p.ativo).map(p => `<option value="${esc(p.id)}">${esc(p.nome)}</option>`).join("");
      const linhaItem = i => `<div class="it"><div style="display:grid;gap:4px;min-width:0"><select class="ip" aria-label="Produto">${prodOpts.replace(`value="${esc(i.produto_id)}"`, `value="${esc(i.produto_id)}" selected`)}</select><input class="id" placeholder="Descrição" value="${esc(i.descricao)}" aria-label="Descrição"></div>
    <input class="iq" type="number" step="0.001" min="0.001" value="${i.quantidade}" aria-label="Quantidade"><input class="iu" type="number" step="0.01" min="0" value="${i.preco_unit}" aria-label="Preço unitário"><button type="button" class="xbtn irm" aria-label="Remover" style="font-size:20px;color:var(--bad)">×</button></div>`;
      const lidos = () => $$("#ied .it").map(it => ({ produto_id: it.querySelector(".ip").value || null, descricao: it.querySelector(".id").value.trim(), quantidade: num(it.querySelector(".iq").value), preco_unit: num(it.querySelector(".iu").value) }));
      let itensLidos = [];
      const p = modal({
        title: novo ? "Novo orçamento" : "Orçamento #" + o.id, wide: true, body: `<div class="grid-form">
    ${fld("cliente_id", "Cliente cadastrado", { opts: optClientes("— cliente novo (preencha abaixo) —"), value: o.cliente_id || "", full: true })}
    ${fld("cliente_nome", "Nome do cliente", { value: o.cliente_nome, req: true })}${fld("telefone", "WhatsApp", { value: o.telefone, mask: "tel", ph: "(19) 99999-9999" })}
    ${fld("titulo", "Título", { value: o.titulo || "", req: true, full: true, ph: "Ex.: Piscina de fibra 6 × 3 m instalada" })}</div>
    <h3 style="margin:16px 0 8px;font-size:15px">Itens <span class="sub" style="font-weight:500">(quantidade · preço unitário)</span></h3>
    <div class="items-ed" id="ied">${itens.map(linhaItem).join("")}</div><button type="button" class="btn sm" id="iadd">+ Item</button>
    <div class="grid-form" style="margin-top:14px">${fld("desconto", "Desconto (R$)", { type: "number", step: "0.01", min: 0, value: o.desconto })}${fld("validade", "Válido até", { type: "date", value: o.validade, req: true })}
    ${fld("status", "Situação", { opts: Object.entries(ST_ORC).filter(([k]) => k !== "convertido").map(([k, v]) => [k, v[0]]), value: o.status })}
    ${fld("condicoes", "Condições (vão na mensagem)", { type: "textarea", value: o.condicoes, full: true })}</div>`,
        validate: d => {
          itensLidos = lidos();
          const validos = itensLidos.filter(i => i.descricao);
          if (!validos.length) return "Adicione pelo menos um item com descrição.";
          if (validos.some(i => !(i.quantidade > 0))) return "Todo item precisa de quantidade maior que zero.";
          if (validos.some(i => i.preco_unit === null || i.preco_unit < 0)) return "Todo item precisa de preço (pode ser zero).";
          const e = validarContato(d, { tel: "telefone" }); if (e) return e;
          const total = validos.reduce((s, i) => s + i.quantidade * i.preco_unit, 0);
          if ((num(d.desconto) || 0) > total) return ["O desconto é maior que o total dos itens.", "desconto"];
          itensLidos = validos; return null;
        }
      });
      const ied = $("#ied");
      $("#iadd").onclick = () => ied.insertAdjacentHTML("beforeend", linhaItem({ produto_id: "", descricao: "", quantidade: 1, preco_unit: 0 }));
      ied.addEventListener("click", e => { if (e.target.closest(".irm")) { if ($$("#ied .it").length > 1) e.target.closest(".it").remove(); else toast("O orçamento precisa de pelo menos um item.", true); } });
      ied.addEventListener("change", e => {
        if (!e.target.classList.contains("ip")) return; const pr = cache.produtos.find(x => x.id === e.target.value); if (!pr) return;
        const it = e.target.closest(".it"); it.querySelector(".id").value = pr.nome; it.querySelector(".iu").value = pr.preco_venda;
      });
      $("#f_cliente_id").onchange = e => { const c = cache.clientes.find(x => x.id == e.target.value); if (c) { $("#f_cliente_nome").value = c.nome; $("#f_telefone").value = fTel(c.telefone); } };
      const r = await p; if (!r) return null;
      const cab = { cliente_id: r.cliente_id ? Number(r.cliente_id) : null, cliente_nome: r.cliente_nome, telefone: D(r.telefone), titulo: r.titulo, desconto: num(r.desconto) || 0, validade: r.validade, status: r.status, condicoes: r.condicoes };
      let id = o.id;
      if (novo) id = (await q(sb.from("orcamentos").insert(cab).select("id").single())).id;
      else { await q(sb.from("orcamentos").update(cab).eq("id", id)); await q(sb.from("orcamento_itens").delete().eq("orcamento_id", id)); }
      await q(sb.from("orcamento_itens").insert(itensLidos.map(i => ({ ...i, orcamento_id: id, total: Math.round(i.quantidade * i.preco_unit * 100) / 100 }))));
      toast("Orçamento salvo.");
      return id;
    }

    /* ================== AGENDA ================== */
    let semanaIni = null;
    TELAS.agenda = async () => {
      if (!semanaIni) { const d = new Date(); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); semanaIni = d.toLocaleDateString("sv-SE"); }
      const fim = addDias(semanaIni, 6);
      const [ag] = await Promise.all([q(sb.from("agenda").select("*, clientes(nome,telefone)").gte("data", semanaIni).lte("data", fim).order("data").order("hora")), carregarClientes()]);
      const dias = Array.from({ length: 7 }, (_, i) => addDias(semanaIni, i));
      $("#view").innerHTML = head("Agenda", `Semana de ${dataBR(semanaIni)} a ${dataBR(fim)}`, `<button class="btn" data-a="prev">← Semana</button><button class="btn" data-a="hoje">Hoje</button><button class="btn" data-a="next">Semana →</button><button class="btn pri" data-a="novo">+ Agendar</button>`) +
        `<div class="list">${dias.map(d => {
          const its = ag.filter(a => a.data === d);
          return `<div class="panel" style="${d === hoje() ? "border-color:var(--water)" : ""}"><h2 style="font-size:17px">${new Date(d + "T12:00:00").toLocaleDateString("pt-BR", { weekday: "long", day: "2-digit", month: "2-digit" })}${d === hoje() ? ' <span class="pill info">hoje</span>' : ""}</h2>
    ${its.length ? its.map(a => `<div class="li" style="align-items:center;flex-wrap:wrap"><span style="min-width:0"><b class="mono">${a.hora ? a.hora.slice(0, 5) : "--:--"}</b> · <b>${esc(TIPOS_AG[a.tipo])}</b> · ${esc(a.clientes?.nome || "")}${a.responsavel ? " · " + esc(a.responsavel) : ""}<br><span class="sub">${a.endereco ? `<a target="_blank" rel="noopener" href="${esc(mapsLink(a.endereco))}">${esc(a.endereco)}</a>` : ""}${a.observacoes ? " — " + esc(a.observacoes) : ""}</span></span>
      <span style="display:flex;gap:6px;flex-wrap:wrap">${a.status === "agendado" ? `${a.clientes?.telefone ? `<a class="btn sm" target="_blank" rel="noopener" href="${esc(waLink(a.clientes.telefone, `Olá, ${a.clientes.nome}! A VicxMoura Piscinas confirma ${TIPOS_AG[a.tipo].toLowerCase()} em ${dataBR(a.data)}${a.hora ? " às " + a.hora.slice(0, 5) : ""}.`))}">Avisar</a>` : ""}<button class="btn sm go" data-a="ok" data-id="${a.id}">Concluir</button><button class="btn sm" data-a="edit" data-id="${a.id}">Editar</button>` : `<span class="pill ${a.status === "concluido" ? "ok" : "mut"}">${a.status === "concluido" ? "Concluído" : "Cancelado"}</span>`}</span></div>`).join("") : `<div class="empty" style="padding:6px;text-align:left">Livre.</div>`}</div>`;
        }).join("")}</div>`;
      delegar($("#view"), {
        prev: () => { semanaIni = addDias(semanaIni, -7); recarregar(); }, next: () => { semanaIni = addDias(semanaIni, 7); recarregar(); },
        hoje: () => { semanaIni = null; recarregar(); },
        novo: () => formAgenda(), edit: id => formAgenda(ag.find(a => a.id == id)),
        ok: async id => { await q(sb.from("agenda").update({ status: "concluido" }).eq("id", id)); toast("Concluído."); recarregar(); }
      });
    };
    async function formAgenda(a) {
      const novo = !a; a = a || { tipo: "manutencao", data: hoje(), status: "agendado" };
      const p = modal({
        title: novo ? "Agendar" : "Editar agendamento", body: `<div class="grid-form">
    ${fld("cliente_id", "Cliente", { opts: optClientes(), value: a.cliente_id || "", full: true })}
    ${fld("tipo", "Tipo", { opts: Object.entries(TIPOS_AG), value: a.tipo })}${fld("responsavel", "Responsável", { value: a.responsavel || "" })}
    ${fld("data", "Data", { type: "date", value: a.data, req: true })}${fld("hora", "Hora", { type: "time", value: a.hora ? a.hora.slice(0, 5) : "" })}
    ${fld("endereco", "Endereço", { value: a.endereco || "", full: true })}
    ${fld("status", "Situação", { opts: [["agendado", "Agendado"], ["concluido", "Concluído"], ["cancelado", "Cancelado"]], value: a.status })}
    ${fld("observacoes", "Observações", { type: "textarea", value: a.observacoes || "", full: true })}</div>`,
        validate: d => novo && d.data < hoje() ? ["A data já passou. Confira o dia.", "data"] : null
      });
      $("#f_cliente_id").onchange = e => { const c = cache.clientes.find(x => x.id == e.target.value); if (c && !$("#f_endereco").value) $("#f_endereco").value = textoEndereco(c); };
      const r = await p; if (!r) return;
      const d = { ...r, cliente_id: r.cliente_id ? Number(r.cliente_id) : null, hora: r.hora || null };
      if (novo) await q(sb.from("agenda").insert(d)); else await q(sb.from("agenda").update(d).eq("id", a.id));
      toast("Agenda salva."); recarregar();
    }

    /* ================== FINANCEIRO ================== */
    let abaFin = "receber", perRec = "mes";
    async function acaoBaixar(id) {
      const r = await modal({ title: "Dar baixa", ok: "Confirmar pagamento", okClass: "go", body: fld("f", "Forma de pagamento", { opts: FORMAS_OPT, value: "pix" }) });
      if (r) { await q(sb.rpc("baixar_lancamento", { p_id: Number(id), p_forma: r.f })); toast("Baixa registrada."); recarregar(); }
    }
    TELAS.financeiro = async () => {
      const d = hoje(), m = mesAtual();
      const iniRec = perRec === "hoje" ? inicioDoDia() : perRec === "7" ? inicioDoDia(addDias(d, -6)) : inicioDoDia(m + "-01");
      const [abertos, pagosMes, pagosPer] = await Promise.all([
        q(sb.from("lancamentos").select("*, clientes(nome,telefone)").eq("status", "aberto").order("vencimento").limit(500)),
        q(sb.from("lancamentos").select("*, clientes(nome)").eq("status", "pago").gte("pago_em", inicioDoDia(m + "-01")).order("pago_em", { ascending: false }).limit(1000)),
        q(sb.from("lancamentos").select("*, clientes(nome)").eq("status", "pago").gte("pago_em", iniRec).order("pago_em", { ascending: false }).limit(1000)), carregarConfig()]);
      const somar = l => l.reduce((s, x) => s + Number(x.valor), 0);
      const rec = abertos.filter(x => x.tipo === "receber"), pag = abertos.filter(x => x.tipo === "pagar"), venc = abertos.filter(x => x.vencimento < d);
      const entMes = somar(pagosMes.filter(x => x.tipo === "receber")), saiMes = somar(pagosMes.filter(x => x.tipo === "pagar"));
      const listas = { receber: rec, pagar: pag, vencidos: venc };
      let corpo;
      if (abaFin === "recebimentos") {
        const porForma = {}; pagosPer.forEach(x => { const f = x.forma_pagamento || "outro"; porForma[f] = porForma[f] || { e: 0, s: 0 }; porForma[f][x.tipo === "receber" ? "e" : "s"] += Number(x.valor); });
        corpo = `<div class="row" style="margin-bottom:12px"><select id="perrec" class="mini" aria-label="Período">${[["hoje", "Hoje"], ["7", "Últimos 7 dias"], ["mes", "Este mês"]].map(([v, l]) => `<option value="${v}" ${v === perRec ? "selected" : ""}>${l}</option>`).join("")}</select><span class="sub">Use para conferir com o extrato do banco e da maquininha.</span></div>
      <div class="panel" style="margin-bottom:14px"><h2>Por forma de pagamento</h2>${tabela([{ t: "Forma" }, { t: "Entrou", r: 1 }, { t: "Saiu", r: 1 }, { t: "Saldo", r: 1 }],
          Object.entries(porForma).map(([f, v]) => `<tr><td>${esc(FORMAS[f] || f)}</td><td class="r num">${brl(v.e)}</td><td class="r num">${brl(v.s)}</td><td class="r num"><b>${brl(v.e - v.s)}</b></td></tr>`).concat(
            Object.keys(porForma).length ? [`<tr><td><b>Total</b></td><td class="r num"><b>${brl(somar(pagosPer.filter(x => x.tipo === "receber")))}</b></td><td class="r num"><b>${brl(somar(pagosPer.filter(x => x.tipo === "pagar")))}</b></td><td class="r num"><b>${brl(somar(pagosPer.filter(x => x.tipo === "receber")) - somar(pagosPer.filter(x => x.tipo === "pagar")))}</b></td></tr>`] : []), "Nada recebido ou pago no período.")}</div>` +
          tabela([{ t: "Pago em" }, { t: "Tipo" }, { t: "Descrição" }, { t: "Forma" }, { t: "Valor", r: 1 }], pagosPer.map(x => `<tr><td>${dataBR(x.pago_em)} ${horaBR(x.pago_em)}</td><td>${x.tipo === "receber" ? '<span class="pill ok">Entrada</span>' : '<span class="pill warn">Saída</span>'}</td><td>${esc(x.descricao)}</td><td>${esc(FORMAS[x.forma_pagamento] || "")}</td><td class="r num">${brl(x.valor)}</td></tr>`), "—");
      } else {
        corpo = tabela([{ t: "Vencimento" }, { t: "Tipo" }, { t: "Descrição" }, { t: "Categoria" }, { t: "Valor", r: 1 }, { t: "Situação" }, { t: "", r: 1 }], listas[abaFin].map(x => {
          const vencido = x.vencimento < d;
          return `<tr><td>${dataBR(x.vencimento)}</td><td>${x.tipo === "receber" ? '<span class="pill ok">Receber</span>' : '<span class="pill warn">Pagar</span>'}</td><td>${esc(x.descricao)}${x.clientes?.nome ? `<br><small>${esc(x.clientes.nome)}</small>` : ""}</td><td>${esc(x.categoria)}</td><td class="r num">${brl(x.valor)}</td>
      <td>${vencido ? '<span class="pill bad">Vencido</span>' : '<span class="pill info">Em aberto</span>'}</td>
      <td><div class="act">${x.tipo === "receber" && x.clientes?.telefone ? `<a class="btn sm" target="_blank" rel="noopener" href="${esc(waLink(x.clientes.telefone, `Olá, ${x.clientes.nome}! Lembrete da VicxMoura Piscinas: ${x.descricao}, valor ${brl(x.valor)}, vencimento ${dataBR(x.vencimento)}.` + linhaPix()))}">Cobrar</a>` : ""}<button class="btn sm go" data-a="baixar" data-id="${x.id}">${x.tipo === "receber" ? "Recebido" : "Pago"}</button>${me.papel === "admin" && !x.venda_id ? `<button class="btn sm danger" data-a="cancelar" data-id="${x.id}">Cancelar</button>` : ""}</div></td></tr>`;
        }), "Nada nesta lista.");
      }
      $("#view").innerHTML = head("Financeiro", "Contas a receber e a pagar, recebimentos e resultado do mês.", `<button class="btn pri" data-a="novo">+ Nova conta</button>`) +
        `<div class="cards"><div class="card"><div class="k">A receber</div><div class="v">${brl(somar(rec))}</div><div class="s">${rec.length} conta(s)</div></div>
   <div class="card"><div class="k">A pagar</div><div class="v">${brl(somar(pag))}</div><div class="s">${pag.length} conta(s)</div></div>
   <div class="card ${venc.length ? "bad" : ""}"><div class="k">Vencidos</div><div class="v">${brl(somar(venc))}</div><div class="s">${venc.length} conta(s)</div></div>
   <div class="card ${entMes - saiMes >= 0 ? "good" : "bad"}"><div class="k">Resultado do mês</div><div class="v">${brl(entMes - saiMes)}</div><div class="s">Entrou ${brl(entMes)} · saiu ${brl(saiMes)}</div></div></div>
  <div class="tabs">${[["receber", "A receber"], ["pagar", "A pagar"], ["vencidos", "Vencidos"], ["recebimentos", "Recebimentos"]].map(([k, l]) => `<button data-a="aba" data-id="${k}" aria-pressed="${abaFin === k}">${l}</button>`).join("")}</div>` + corpo;
      const pr = $("#perrec"); if (pr) pr.onchange = e => { perRec = e.target.value; recarregar(); };
      delegar($("#view"), {
        aba: k => { abaFin = k; recarregar(); },
        baixar: id => acaoBaixar(id),
        cancelar: async id => {
          const r = await modal({ title: "Cancelar conta", ok: "Cancelar conta", okClass: "danger", body: "<p>A conta sai das listas. Use quando foi lançada por engano.</p>" });
          if (r) { await q(sb.from("lancamentos").update({ status: "cancelado" }).eq("id", id)); toast("Conta cancelada."); recarregar(); }
        },
        novo: async () => {
          await carregarClientes();
          const p = modal({
            title: "Nova conta", body: `<div class="grid-form">${fld("tipo", "Tipo", { opts: [["pagar", "A pagar (despesa)"], ["receber", "A receber"]] })}${fld("categoria", "Categoria", { opts: CATS_PAGAR })}
        ${fld("descricao", "Descrição", { req: true, full: true, ph: "Ex.: Compra de cloro – Fornecedor X" })}${fld("valor", "Valor (R$)", { type: "number", step: "0.01", min: 0.01, req: true })}${fld("vencimento", "Vencimento", { type: "date", value: d, req: true })}
        ${fld("cliente_id", "Cliente (opcional)", { opts: optClientes(), full: true })}</div>`,
            validate: x => !(num(x.valor) > 0) ? ["O valor deve ser maior que zero.", "valor"] : null
          });
          $("#f_tipo").onchange = e => { $("#f_categoria").innerHTML = (e.target.value === "pagar" ? CATS_PAGAR : CATS_RECEBER).map(c => `<option>${c}</option>`).join(""); };
          const r = await p; if (!r) return;
          await q(sb.from("lancamentos").insert({ tipo: r.tipo, categoria: r.categoria, descricao: r.descricao, valor: num(r.valor), vencimento: r.vencimento, cliente_id: r.cliente_id ? Number(r.cliente_id) : null }));
          toast("Conta lançada."); recarregar();
        }
      });
    };

    /* ================== CONFIGURAÇÕES (admin) ================== */
    TELAS.config = async () => {
      if (me.papel !== "admin") return ir("painel");
      const c = await carregarConfig();
      const whats = D(c.whatsapp).replace(/^55(?=\d{10,11}$)/, "");
      $("#view").innerHTML = head("Configurações", "O que você muda aqui vale na hora no site.") +
        `<form class="panel" id="fcfg" novalidate style="max-width:760px"><div class="grid-form">
    ${fld("whatsapp", "WhatsApp da loja", { value: whats, mask: "tel", ph: "(19) 99999-9999", req: true, dica: "Número que recebe pedidos e mensagens do site." })}
    ${fld("aceita_pedidos", "Receber pedidos pelo site", { type: "checkbox", value: c.aceita_pedidos })}
    ${fld("pix_chave", "Chave Pix", { value: c.pix_chave, ph: "CNPJ, e-mail, telefone ou chave aleatória", dica: "Aparece para o cliente ao finalizar o pedido e nas cobranças." })}
    ${fld("pix_nome", "Nome do recebedor Pix", { value: c.pix_nome })}
    ${fld("frete_valor", "Valor do frete (R$)", { type: "number", step: "0.01", min: 0, value: c.frete_valor, req: true })}
    ${fld("frete_gratis_acima", "Frete grátis a partir de (R$)", { type: "number", step: "0.01", min: 0, value: c.frete_gratis_acima, req: true, dica: "Use 0 para frete sempre grátis." })}
    ${fld("cidades", "Cidades atendidas (uma por linha)", { type: "textarea", value: (c.cidades || []).join("\n"), full: true, dica: "Pedidos de outras cidades são recusados com aviso para chamar no WhatsApp. Deixe vazio para aceitar qualquer cidade." })}
    ${fld("aviso", "Aviso no topo do site (opcional)", { value: c.aviso, full: true, ph: "Ex.: Feriado: entregas voltam na segunda-feira", attrs: 'maxlength="200"' })}
  </div><div id="cerr" class="msg err" hidden style="margin-top:12px"></div><div class="row" style="margin-top:14px"><button class="btn pri">Salvar configurações</button><span class="sub">Atualizado em ${dataBR(c.atualizado_em)} ${horaBR(c.atualizado_em)}</span></div></form>`;
      $("#fcfg").addEventListener("submit", e => {
        e.preventDefault(); run(async () => {
          const f = Object.fromEntries(new FormData(e.target)); const err = $("#cerr"); err.hidden = true;
          const falha = (m, k) => { err.textContent = m; err.hidden = false; if (k) $("#f_" + k).focus(); throw Object.assign(new Error(m), { silencioso: true }); };
          if (!MC.telValido(f.whatsapp)) falha("WhatsApp inválido. Use DDD + número.", "whatsapp");
          if (!(num(f.frete_valor) >= 0)) falha("Valor do frete inválido.", "frete_valor");
          if (!(num(f.frete_gratis_acima) >= 0)) falha("Valor de frete grátis inválido.", "frete_gratis_acima");
          const cidades = [...new Set(String(f.cidades || "").split(/\n|,|;/).map(s => s.trim()).filter(Boolean))];
          await q(sb.from("config_site").update({
            whatsapp: "55" + D(f.whatsapp), pix_chave: String(f.pix_chave || "").trim(), pix_nome: String(f.pix_nome || "").trim(),
            frete_valor: num(f.frete_valor), frete_gratis_acima: num(f.frete_gratis_acima), cidades, aceita_pedidos: $("#f_aceita_pedidos").checked,
            aviso: String(f.aviso || "").trim(), atualizado_em: new Date().toISOString()
          }).eq("id", 1));
          toast("Configurações salvas. O site já usa os novos valores."); recarregar();
        });
      });
    };

    /* ================== EQUIPE (admin) ================== */
    TELAS.equipe = async () => {
      if (me.papel !== "admin") return ir("painel");
      const ps = await q(sb.from("perfis").select("*").order("criado_em"));
      $("#view").innerHTML = head("Equipe", "Quem pode entrar no sistema.") +
        `<div class="banner info" style="display:block"><b>Para dar acesso a alguém:</b> no Supabase, vá em <b>Authentication → Users → Add user → Create new user</b>, informe o e-mail e uma senha e marque <b>Auto Confirm User</b>. A pessoa aparece aqui como "Aguardando": clique em <b>Ativar</b>.</div>` +
        tabela([{ t: "Nome" }, { t: "E-mail" }, { t: "Papel" }, { t: "Acesso" }, { t: "", r: 1 }], ps.map(p => `<tr><td>${esc(p.nome)}</td><td>${esc(p.email)}</td><td>${p.papel === "admin" ? "Administrador" : "Funcionário"}</td><td>${p.ativo ? '<span class="pill ok">Ativo</span>' : '<span class="pill warn">Aguardando</span>'}</td>
    <td><div class="act">${p.id === me.id ? `<button class="btn sm" data-a="nome" data-id="${p.id}">Meu nome</button>` : `<button class="btn sm ${p.ativo ? "danger" : "go"}" data-a="ativo" data-id="${p.id}">${p.ativo ? "Bloquear" : "Ativar"}</button><button class="btn sm" data-a="papel" data-id="${p.id}">${p.papel === "admin" ? "Tornar funcionário" : "Tornar administrador"}</button><button class="btn sm" data-a="nome" data-id="${p.id}">Nome</button>`}</div></td></tr>`));
      delegar($("#view"), {
        ativo: async id => { const p = ps.find(x => x.id === id); await q(sb.from("perfis").update({ ativo: !p.ativo }).eq("id", id)); toast(p.ativo ? "Acesso bloqueado." : "Acesso liberado."); recarregar(); },
        papel: async id => { const p = ps.find(x => x.id === id); await q(sb.from("perfis").update({ papel: p.papel === "admin" ? "funcionario" : "admin" }).eq("id", id)); recarregar(); },
        nome: async id => {
          const p = ps.find(x => x.id === id); const r = await modal({ title: "Nome", body: fld("n", "Nome", { value: p.nome, req: true, full: true }), validate: d => d.n.length < 2 ? ["Informe o nome.", "n"] : null });
          if (r) { await q(sb.from("perfis").update({ nome: r.n }).eq("id", id)); if (id === me.id) me.nome = r.n; recarregar(); }
        }
      });
    };

    /* ================== start ================== */
    if (!window.MC) { document.getElementById("screen").innerHTML = '<div class="center"><div class="msg err">Arquivo comum.js não encontrado. Envie a pasta completa para a hospedagem.</div></div>'; }
    else if (!window.supabase || !CFG.supabaseUrl || !CFG.supabaseAnonKey) telaConfig();
    else {
      sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey);
      sb.auth.onAuthStateChange(ev => { if (ev === "SIGNED_OUT" && me) { me = null; telaLogin(); } });
      iniciar().catch(e => telaLogin(traduz(e.message)));
    }
  </script>
</body>

</html>
